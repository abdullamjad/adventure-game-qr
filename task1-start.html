<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 - START</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .task-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #555;
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .message.penalty {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffeaa7;
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="task-badge">🎯 TASK 1</div>
            <h1>START MISSION</h1>
            <p class="subtitle">Scan to begin your challenge</p>
        </div>
        
        <div class="info-box">
            ⏱️ <strong>Time Limit:</strong> 20 minutes<br>
            ⚠️ <strong>Penalty:</strong> 15 min lockout if failed
        </div>
        
        <form id="startForm">
            <div class="form-group">
                <label for="teamId">Enter Your Team ID</label>
                <input 
                    type="text" 
                    id="teamId" 
                    name="teamId" 
                    placeholder="e.g., TEAM_ALPHA" 
                    required
                    autocomplete="off"
                >
            </div>
            
            <button type="submit" id="submitBtn">
                🚀 START TASK
            </button>
        </form>
        
        <div class="loader" id="loader"></div>
        <div class="message" id="message"></div>
    </div>

    <script>
        const form = document.getElementById('startForm');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const message = document.getElementById('message');
        const teamIdInput = document.getElementById('teamId');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const teamId = teamIdInput.value.trim().toUpperCase();
            
            if (!teamId) {
                showMessage('Please enter a valid Team ID', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'STARTING...';
            loader.style.display = 'block';
            message.style.display = 'none';

            try {
                const response = await fetch('https://adventure-game-proxy.vercel.app/api/proxy?action=start&teamId=' + encodeURIComponent(teamId), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                const data = await response.json();

                loader.style.display = 'none';

                if (data.success) {
                    showMessage('✅ TIMER STARTED! Go complete your challenge!', 'success');
                    teamIdInput.value = '';
                    setTimeout(() => {
                        showMessage('🏃 Challenge in progress... Scan END QR when done!', 'success');
                    }, 3000);
                } else {
                    if (data.minutesRemaining) {
                        showMessage(`⏳ PENALTY ACTIVE! ${data.minutesRemaining} minutes remaining`, 'penalty');
                    } else {
                        showMessage('❌ ' + (data.message || 'Failed to start task'), 'error');
                    }
                }

            } catch (error) {
                loader.style.display = 'none';
                showMessage('❌ Connection error. Please try again.', 'error');
                console.error('Error:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 START TASK';
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
        }
    </script>
</body>
</html>
